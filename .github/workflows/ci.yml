name: CI

# Every push and pull request: run the tests, compile the five Arduino sketches
# and build BoltControl.exe. Pushing a tag like v1.1 also publishes a release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: App tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python tests/test_app.py

  firmware:
    name: Arduino sketches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install Servo
      - name: Compile (warnings are errors)
        run: |
          set -e
          for sk in car led rgb voice; do
            echo "::group::$sk (Uno)"
            arduino-cli compile --fqbn arduino:avr:uno --warnings all "${sk}_firmware" 2>&1 | tee log.txt
            ! grep -E "${sk}_firmware\.ino:[0-9]+:[0-9]+: warning" log.txt
            echo "::endgroup::"
          done
          echo "::group::otto (Nano)"
          arduino-cli compile --fqbn arduino:avr:nano --warnings all otto_firmware 2>&1 | tee log.txt
          ! grep -E "otto_firmware\.ino:[0-9]+:[0-9]+: warning" log.txt
          echo "::endgroup::"

  build:
    name: Build BoltControl.exe
    needs: [test, firmware]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name BoltControl bolt_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: BoltControl
          path: dist/BoltControl.exe
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" dist/BoltControl.exe --clobber
          } else {
            gh release create "${{ github.ref_name }}" dist/BoltControl.exe --title "Bolt Control ${{ github.ref_name }}" --generate-notes
          }
